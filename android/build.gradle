allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    // objectbox_flutter_libs 4.x compiles against android-31, which fails AGP 9's AAR metadata check
    if (project.name == "objectbox_flutter_libs") {
        afterEvaluate {
            android {
                compileSdk 37
            }
        }
    }
}
subprojects {
    // mapbox_maps_flutter only applies kotlin-android on AGP < 9 (it expects AGP's built-in Kotlin after that),
    // but this app runs AGP 9 with android.builtInKotlin=false.
    if (project.name == "mapbox_maps_flutter_mobile") {
        project.plugins.withId("com.android.library") {
            project.apply plugin: "org.jetbrains.kotlin.android"
        }
    }
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
